<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170f13" />
    <title>풍수도사 — 사람과 장소의 궁합</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="home" id="home" aria-labelledby="page-title">
        <div class="moon" aria-hidden="true"></div>
        <p class="eyebrow">사주 × 풍수 장소 궁합</p>
        <h1 id="page-title">풍수도사</h1>
        <p class="intro">사람의 기운과 이 자리가<br />만나면 어떤 일이 생길까.</p>

        <form class="profile-form" id="reading-form">
          <label>이름<input id="name" name="name" autocomplete="name" placeholder="이름을 입력해 주세요" maxlength="30" required /></label>
          <div class="form-row">
            <label>생년월일<input id="birth-date" name="birthDate" type="date" required /></label>
            <label>출생시간<span class="optional">선택</span><input id="birth-time" name="birthTime" type="time" /></label>
          </div>
          <label>궁금한 장소<input id="address" name="address" autocomplete="street-address" placeholder="주소를 입력해 주세요" maxlength="200" required /></label>
          <button class="submit-button" type="submit">이 자리와 나의 궁합 보기 <span>→</span></button>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>
        <div class="loading" id="loading" hidden>
          <span class="loading-orb"></span><p>도사가 이야기를<br />준비하고 있어요</p>
        </div>
      </section>

      <section class="viewer" id="viewer" aria-label="풍수 상담 영상" hidden>
        <video id="oracle-video" playsinline muted preload="auto"></video>
        <div class="video-shade" aria-hidden="true"></div>
        <header class="viewer-header">
          <span class="live-dot">상담 중</span>
          <strong id="viewer-name">김현경</strong>
          <span id="place-name"></span>
        </header>
        <p id="caption" class="caption" aria-live="polite"></p>
        <button id="play-toggle" class="play-toggle" type="button" aria-label="재생 일시정지" aria-pressed="false">
          <span class="pause-icon" aria-hidden="true"></span>
          <span class="play-icon" aria-hidden="true"></span>
          <span class="toggle-label">일시정지</span>
        </button>
        <button id="close-button" class="close-button" type="button" aria-label="상담 닫기">×</button>
        <div class="sound-indicator"><span></span><span></span><span></span> 도사의 말</div>
        <audio id="narration" preload="auto"></audio>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
