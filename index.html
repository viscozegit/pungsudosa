<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170f13" />
    <title>풍수도사 — 사람과 장소의 궁합</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="home" id="home" aria-labelledby="page-title">
        <div class="moon" aria-hidden="true"></div>
        <div class="form-topbar"><button type="button" class="back-button" aria-label="뒤로">‹</button><span>풍수도사</span></div>
        <p class="eyebrow">사주 × 풍수 장소 궁합</p>
        <h1 id="page-title">나의 사주와<br />이 자리의 이야기</h1>
        <section class="oracle-picker" aria-label="상담 도사 선택">
          <p>오늘의 도사를 골라주세요</p>
          <div class="oracle-options">
            <button class="oracle-option selected" type="button" data-oracle="shaman" aria-pressed="true"><img src="assets/character-shaman.jpg" alt="여자 무당 캐릭터" /><span>무당님</span></button>
            <button class="oracle-option" type="button" data-oracle="dog" aria-pressed="false"><img src="assets/character-dog.jpg" alt="강아지 무당 캐릭터" /><span>강아지 도사</span></button>
          </div>
        </section>
        <form class="profile-form" id="reading-form">
          <label>이름<input id="name" name="name" autocomplete="name" placeholder="이름을 입력해 주세요 (최대 4글자)" maxlength="4" required /></label>
          <div class="input-with-options"><input id="birth-date-input" name="birthDateInput" inputmode="numeric" autocomplete="bday" aria-label="생년월일" placeholder="생년월일 0000.00.00" maxlength="10" required /><div class="inline-options"><label class="date-type"><input type="radio" name="calendarType" checked /> 양력</label><label class="date-type"><input type="radio" name="calendarType" /> 음력</label></div></div>
          <div class="input-with-options"><input id="birth-time-input" name="birthTimeInput" inputmode="numeric" autocomplete="off" aria-label="태어난 시간" placeholder="태어난 시간 (예: 13:20)" maxlength="5" /><label class="check-line"><input id="unknown-time" type="checkbox" /> 시간 모름</label></div>
          <fieldset class="gender-field"><legend>성별</legend><div class="gender-buttons"><button type="button" class="gender-button" data-gender="male">남성</button><button type="button" class="gender-button" data-gender="female">여성</button></div></fieldset>
          <label>궁금한 장소<input id="address" name="address" autocomplete="street-address" placeholder="주소를 입력해 주세요" maxlength="200" required /></label>
          <button class="submit-button" type="submit">다 입력했어요!</button>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>
        <div class="loading" id="loading" hidden>
          <span class="loading-orb"></span><p id="loading-message">도사가 이야기를<br />준비하고 있어요</p><strong id="loading-percent">0%</strong>
        </div>
      </section>

      <section class="viewer" id="viewer" aria-label="풍수 상담 영상" hidden>
        <video class="oracle-video is-active" playsinline muted preload="auto"></video>
        <video class="oracle-video" playsinline muted preload="auto"></video>
        <div class="video-shade" aria-hidden="true"></div>
        <header class="viewer-header">
          <span class="live-dot">상담 중</span>
          <strong id="viewer-name">김현경</strong>
          <span id="place-name"></span>
        </header>
        <p id="caption" class="caption" aria-live="polite"></p>
        <button id="play-toggle" class="play-toggle" type="button" aria-label="재생 일시정지" aria-pressed="false">
          <span class="pause-icon" aria-hidden="true"></span>
          <span class="play-icon" aria-hidden="true"></span>
          <span class="toggle-label">일시정지</span>
        </button>
        <button id="replay-button" class="replay-button" type="button" hidden>처음부터 다시 듣기</button>
        <button id="close-button" class="close-button" type="button" aria-label="상담 닫기">×</button>
        <div class="sound-indicator"><span></span><span></span><span></span> 도사의 말</div>
        <audio id="narration" preload="auto"></audio>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
